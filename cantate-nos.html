<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contate-nos - Unhas Feitas</title>
</head>
<body>

    <header>
        <h1>Entre em Contato</h1>
        <p>Se você tiver alguma dúvida, sugestão ou quiser saber mais sobre nossos produtos e serviços, não hesite em entrar em contato conosco. Estamos sempre prontos para ouvir você e ajudar no que for necessário. 💖</p>
    </header>

    <main>
        <form action="enviar_contato.php" method="POST">
            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <br>
            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <br>
            <div>
                <label for="mensagem">Mensagem:</label><br>
                <textarea id="mensagem" name="mensagem" rows="5" cols="30" required></textarea>
            </div>
            <br>
            <button type="submit">Enviar</button>
        </form>
    </main>

    <footer>
        <br>
        <a href="index.html">Voltar para o início</a>
    </footer>

</body>
</html>
